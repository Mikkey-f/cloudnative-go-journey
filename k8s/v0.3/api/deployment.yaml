apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnative-api
  labels:
    app: cloudnative-api
    version: v0.3
spec:
  # 副本数（HPA 会管理这个值）
  replicas: 2
  
  # 选择器
  selector:
    matchLabels:
      app: cloudnative-api
  
  # 更新策略
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # 最多可超出期望副本数的数量
      maxUnavailable: 0  # 更新过程中，最多不可用的副本数
  
  # Pod 模板
  template:
    metadata:
      labels:
        app: cloudnative-api
        version: v0.3
      annotations:
        # Prometheus 抓取配置
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api
        image: cloudnative-api:v0.3
        imagePullPolicy: IfNotPresent
        
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        
        # 环境变量
        env:
        - name: APP_ENV
          value: "production"
        
        - name: LOG_LEVEL
          value: "info"
        
        - name: REDIS_HOST
          value: "redis-service"
        
        - name: REDIS_PORT
          value: "6379"
        
        - name: CACHE_TTL
          value: "300"
        
        # Pod 信息注入
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        
        # ⭐ v0.3 优化的资源配置（为 HPA 准备）
        resources:
          requests:
            memory: "128Mi"  # HPA 计算基准
            cpu: "100m"      # HPA 计算基准
          limits:
            memory: "512Mi"  # 4x 突发比（增加以支持负载测试）
            cpu: "500m"      # 5x 突发比（增加以支持 CPU 密集型任务）
        
        # 存活探针（优化：增加超时和失败阈值，避免误杀）
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15     # 增加初始延迟（原来 10 秒）
          periodSeconds: 15           # 每 15 秒检查一次（原来 10 秒）
          timeoutSeconds: 10          # 超时时间 10 秒（原来 5 秒）
          successThreshold: 1
          failureThreshold: 5         # 允许失败 5 次（原来 3 次），即 75 秒
        
        # 就绪探针（优化：增加超时和失败阈值，适应负载测试）
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10          # 每 10 秒检查一次（原来 5 秒）
          timeoutSeconds: 10          # 超时时间 10 秒（原来 3 秒）
          successThreshold: 1
          failureThreshold: 6         # 允许失败 6 次（原来 3 次），即 60 秒
        
        # 启动探针（加快启动检测）
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 2
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 15  # 最多等待 30 秒
      
      # 重启策略
      restartPolicy: Always
      
      # 优雅关闭时间
      terminationGracePeriodSeconds: 30

