apiVersion: v1
kind: Service
metadata:
  name: cloudnative-api-service
  labels:
    app: cloudnative-api
    version: v0.3
spec:
  type: NodePort
  selector:
    app: cloudnative-api
  ports:
  - name: http
    protocol: TCP
    port: 80         # Service 对外端口
    targetPort: 8080 # Pod 端口
    nodePort: 30080  # NodePort（可选，不指定则随机分配）

