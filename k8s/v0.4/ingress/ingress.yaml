# v0.4 Ingress 配置
# 功能: 配置外部流量入口，路由到前端和 API 服务
# 部署: kubectl apply -f k8s/v0.4/ingress/ingress.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    # 可选: 添加 HTTPS 重定向
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  # 基于域名和路径的路由规则
  - host: app.local
    http:
      paths:
      # API 路由: /api -> api-service:8080
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 8080
      # 前端路由: / -> frontend-service:8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8080

---
# 说明:
# 1. ingressClassName: nginx - 指定使用 Nginx Ingress Controller
# 2. host: app.local - 需要在本地 /etc/hosts 中配置: 127.0.0.1 app.local
# 3. pathType: Prefix - 前缀匹配，/api 会匹配 /api, /api/v1, /api/v1/version 等
# 4. 路由优先级: 更具体的路径优先，所以 /api 优先于 /

# 访问方式:
# - 前端: curl http://app.local/
# - API: curl http://app.local/api/v1/hello
# - 版本: curl http://app.local/api/v1/version
