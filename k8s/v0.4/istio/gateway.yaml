# v0.4 Istio Gateway 配置
# 功能: 定义外部流量入口，与 VirtualService 配合实现流量管理
# 部署: kubectl apply -f k8s/v0.4/istio/gateway.yaml

apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: app-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "app.local"

---
# 说明:
# 1. selector: 选择 istio-ingressgateway Pod
# 2. port: 监听 80 端口，HTTP 协议
# 3. hosts: 接受所有主机名
# 4. 需要与 VirtualService 配合使用
