# v0.4 API v2 Deployment
# 功能: 部署 API v2 (新版本) - 1 个副本
# 部署: kubectl apply -f k8s/v0.4/api/deployment-v2.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v2
  namespace: default
  labels:
    app: api
    version: v2
  annotations:
    sidecar.istio.io/inject: "true"
spec:
  replicas: 5  # v2 金丝雀版本，1 个副本（与 v1 对称），对应 10% 流量
  selector:
    matchLabels:
      app: api
      version: v2
  template:
    metadata:
      labels:
        app: api
        version: v2
    spec:
      containers:
      - name: api
        image: api:latest  # 使用同一个镜像，通过环境变量区分版本
        imagePullPolicy: Never  # 本地开发使用 Never
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: ENVIRONMENT
          value: "production"
        - name: API_VERSION
          value: "v2"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        
        # 健康检查
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # 资源限制
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

---
# 说明:
# 1. replicas: 1 - 1 个副本，对应 10% 流量分配
# 2. version: v2 - 标签用于 DestinationRule 子集匹配
# 3. image: api:v2 - 使用 v2 镜像
# 4. REDIS_HOST: redis-service - 连接到 Redis 服务
# 5. livenessProbe: 存活探针
# 6. readinessProbe: 就绪探针

# 部署前需要:
# 1. 构建 v2 Docker 镜像: docker build -f Dockerfile.v2 -t api:v2 .
# 2. 部署 Redis: kubectl apply -f k8s/v0.3/redis/deployment.yaml

# 金丝雀发布流程:
# 1. 初始: 100% 流量到 v1 (9 个副本)
# 2. 第一阶段: 90% v1 (9 个副本), 10% v2 (1 个副本) - 本配置
# 3. 第二阶段: 50% v1 (5 个副本), 50% v2 (5 个副本)
# 4. 第三阶段: 0% v1 (0 个副本), 100% v2 (10 个副本)
# 5. 完成: 删除 v1，100% 流量到 v2
