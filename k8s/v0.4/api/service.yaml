# v0.4 API 服务 Service
# 功能: 为 API v1 和 v2 Pod 提供内部服务发现
# 部署: kubectl apply -f k8s/v0.4/api/service.yaml

apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: default
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api  # 同时选择 v1 和 v2 Pod
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP

---
# 说明:
# 1. type: ClusterIP - 仅在集群内部可访问
# 2. selector: app: api - 选择所有标签为 app: api 的 Pod (包括 v1 和 v2)
# 3. port: 8080 - Service 端口
# 4. targetPort: 8080 - Pod 端口

# 流量分配:
# - Service 会将流量均匀分配到所有 Pod
# - 但 Istio VirtualService 会根据权重重新分配
# - VirtualService 配置: 90% v1, 10% v2

# 访问方式:
# - 集群内部: http://api-service:8080
# - 集群内部: http://api-service.default.svc.cluster.local:8080
# - 外部 (通过 Ingress): http://app.local/api
